# Music Encoding Benchmark Configuration
#
# This file controls what tests are run and how.
# Modify the filters section to run different subsets of tests.
#
# FILTER LOGIC: All filters are AND'd together. For example, if you set
# formats: [abc] AND passages: [P-001, P-002] AND question_types: [1, 2],
# you'll get ABC questions of types 1 and 2 for passages P-001 and P-002.
# If filters conflict (e.g., no questions match), you'll get 0 test cases.

# ============================================================================
# FILTERS - Control which test cases to run
# ============================================================================
filters:
  # Encoding formats to test
  # Options: abc, humdrum, mei, musicxml
  formats:
    - abc
  
  # Only run verified questions
  verified_only: false
  
  # Filter by passage length (number of measures)
  # Options: [1] for 1-bar, [8] for 8-bar, [1, 8] for both, null for all
  num_measures: null
  
  # Filter by specific passages
  # Example: ["P-001", "P-002", "P-003"], null for all
  passages: null
  
  # Filter by question IDs
  # Example: ["Q-001", "Q-010", "Q-020"], null for all
  question_ids: null
  
  # Filter by question type (1-9)
  # 1: Note count (lower), 2: Note count (upper), 3: First pitch (upper)
  # 4: Lowest pitch (lower), 5: Longest duration, 6: Pitch classes (lower)
  # 7: Interval (upper), 8: Rest count, 9: First note duration (lower)
  # Example: [1, 2, 3], null for all
  question_types: null
  
  # Limit number of test cases for testing/debugging (e.g., 5)
  # null for no limit
  limit: null

# ============================================================================
# MODELS - LLM providers and models to test
# ============================================================================
models:
  # OpenAI
  - provider: openai
    name: gpt-5.1-2025-11-13
    enabled: false
    use_batch_api: true  # Set to true for 50% cost savings
  
  # Anthropic Claude
  - provider: anthropic
    name: claude-sonnet-4-5
    enabled: false
    use_batch_api: true # Set to true for 50% cost savings
  
  # Google Gemini
  - provider: google
    name: gemini-3-pro-preview
    enabled: true  # Retrying failed tests
    use_batch_api: true  # 50% cost savings, higher rate limits
  
  # Alibaba Qwen
  - provider: alibaba
    name: qwen3-max
    enabled: false

  # Local models (HuggingFace Transformers)
  # Requires: pip install transformers torch accelerate
  - provider: transformers
    name: microsoft/phi-4
    enabled: false  # Very slow on CPU (~13 min per test case)

# ============================================================================
# API SETTINGS - Global defaults (can be overridden per model)
# ============================================================================
api_settings:
  temperature: 0.0      # Deterministic outputs
  seed: 42              # Reproducibility
  max_tokens: 16384     # Response length (high to avoid truncation)
  timeout: 300          # 5 minutes per request
  rate_limit_delay: 1.0 # Seconds between requests

# ============================================================================
# BATCH API SETTINGS
# Only applies to models with use_batch_api: true
# OpenAI, Anthropic, and Google support batch APIs (50% cost savings, higher rate limits)
# ============================================================================
batch_settings:
  batch_size: 100         # Requests per batch
  check_interval: 60     # Seconds between status checks
  max_wait_time: 86400   # Maximum wait time (24 hours for Gemini batch)
  save_batch_ids: true   # Save batch IDs for resumption

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================
output:
  base_dir: outputs      # Base output directory
  run_id: null           # Custom run ID (null = auto-generate timestamp)
  
  # Resumption settings
  # Set resume_run_id to continue a previous run (e.g., "20251127_145448")
  resume_run_id: 20251127_145448    # Run ID to resume (null = start fresh)
  retry_failed: true     # Retry tests that previously failed (success: false)
  
  # What to save
  save_prompts: true     # Save full prompts sent to LLM
  save_responses: true   # Save individual response files
  save_metadata: true    # Save API metadata (tokens, timing)
  save_to_database: true # Store results in llm_responses table
  
  # Summary formats
  generate_csv_summary: true
  generate_json_summary: true

# ============================================================================
# PROMPT SETTINGS
# ============================================================================
prompt:
  system_prompt_file: prompts/system_prompt.txt
  include_format_hint: true  # Add "[This is ABC notation]" hint
  enforce_json: true         # Use API-level JSON mode where available

# ============================================================================
# EXECUTION SETTINGS
# ============================================================================
execution:
  runs_per_question: 3   # Number of times to run each question (for consistency)
  concurrency: 0         # 0 = sequential
  retry_on_failure: true
  max_retries: 3
  retry_delay: 5.0
  show_progress: true
  verbose: false
  dry_run: false         # Validate without calling APIs
