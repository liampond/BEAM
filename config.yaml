filters:
  formats:
  - abc
  - humdrum
  - mei
  - musicxml
  verified_only: false
  num_measures:
  - 8
  passages: null
  question_ids: null
  question_types: null
  limit: null
models:
- provider: openai
  name: gpt-5.4
  enabled: false
  use_batch_api: true
  reasoning_effort: high
  max_tokens: 65536
- provider: anthropic
  name: claude-opus-4-7
  enabled: false
  use_batch_api: true
  reasoning_effort: high
  max_tokens: 65536
- provider: google
  name: gemini-3.1-pro-preview
  enabled: false
  use_batch_api: true
  temperature: 1.0
  max_tokens: 65536
api_settings:
  temperature: 0.0
  seed: 42
  max_tokens: 256
  timeout: 300
  rate_limit_delay: 1.0
batch_settings:
  batch_size: 100
  check_interval: 60
  max_wait_time: 86400
  save_batch_ids: true
output:
  base_dir: outputs
  database: beam.db
  run_id: null
  resume_run_id: null
  retry_failed: false
  save_prompts: true
  save_responses: true
  save_metadata: true
  save_to_database: true
  generate_csv_summary: true
  generate_json_summary: true
prompt:
  system_prompt_file: prompts/system_prompt.txt
  include_format_hint: true
  enforce_json: true
execution:
  runs_per_question: 1
  concurrency: 0
  retry_on_failure: true
  max_retries: 3
  retry_delay: 5.0
  show_progress: true
  verbose: false
  dry_run: false
