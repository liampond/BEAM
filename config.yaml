filters:
  formats:
  - musicxml
  verified_only: false
  num_measures:
  - 1
  passages: null
  question_ids: null
  question_types: null
  limit: 3
models:
- provider: openai
  name: gpt-5.4-nano
  enabled: true
  use_batch_api: true
- provider: anthropic
  name: claude-haiku-4-5
  enabled: true
  use_batch_api: true
- provider: google
  name: gemini-3.1-flash-lite-preview
  enabled: true
  use_batch_api: true
  temperature: 1.0
  max_tokens: 32768
- provider: alibaba
  name: qwen3-max
  enabled: false
  use_batch_api: false
- provider: transformers
  name: microsoft/phi-4
  enabled: false
api_settings:
  temperature: 0.0
  seed: 42
  max_tokens: 256
  timeout: 300
  rate_limit_delay: 1.0
batch_settings:
  batch_size: 100
  check_interval: 60
  max_wait_time: 86400
  save_batch_ids: true
output:
  base_dir: outputs
  run_id: phase4_pilot_v3
  resume_run_id: null
  retry_failed: false
  save_prompts: true
  save_responses: true
  save_metadata: true
  save_to_database: true
  generate_csv_summary: true
  generate_json_summary: true
prompt:
  system_prompt_file: prompts/system_prompt.txt
  include_format_hint: true
  enforce_json: true
execution:
  runs_per_question: 1
  concurrency: 0
  retry_on_failure: true
  max_retries: 3
  retry_delay: 5.0
  show_progress: true
  verbose: false
  dry_run: false
